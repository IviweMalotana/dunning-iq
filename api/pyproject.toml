[project]
name = "dunning-iq-api"
version = "0.1.0"
description = "Dunning IQ — AI agent for failed recurring payments (FastAPI backend)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.3",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.28.0",
    "openai>=2.44.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.3.0",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends()/Header() in argument defaults is the intended idiom.
ignore = ["B008"]

[tool.setuptools]
packages = ["app"]
