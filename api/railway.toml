# Railway deployment for the FastAPI API.
# Set the service root directory to `/api` in Railway, then this file applies.
#
# Required env vars (set in the Railway service):
#   DATABASE_URL          → auto-injected by the linked Postgres plugin
#   ANTHROPIC_API_KEY     → enables the live Claude agent (optional; the engine
#                           falls back to deterministic reasoning without it)
#   WEBHOOK_SIGNING_SECRET → enforces webhook HMAC verification in prod
#   CORS_ORIGINS          → comma-separated list, including your Vercel domain
#   ENVIRONMENT=production
#
# After the first deploy, seed the demo dataset from a one-off shell:
#   railway run python -m app.seed.run

[build]
builder = "NIXPACKS"

[deploy]
# Run migrations on every release, then boot uvicorn on Railway's $PORT.
startCommand = "uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
